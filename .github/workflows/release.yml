name: Build and publish Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#release/}}"
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git checkout --detach "refs/tags/$version"
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
      - name: Build and package on Ubuntu 26.04 x86-64
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/repo" -w /repo -e RELEASE_VERSION \
            ubuntu:26.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --no-install-recommends -y \
                7zip build-essential ca-certificates curl patch pkgconf python3 \
                libx11-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev \
                libxrender-dev libsm-dev libice-dev libfreetype-dev libfontconfig-dev
              archive=/tmp/SEGGER_Qt487_Src.7z
              curl --fail --silent --show-error --location --retry 3 \
                https://download.segger.com/3rdParty/SEGGER_Qt487_Src.7z -o "$archive"
              printf "%s  %s\n" \
                09a32c0d0292c128f91f045ac129b0418d99f2936a6e08b22797f72d73e5f6bd "$archive" |
                sha256sum --check
              7z x -y -o/tmp/qt-source "$archive" >/tmp/qt-extraction.log
              test -f /tmp/qt-source/configure
              set -o pipefail
              JOBS=4 ./scripts/build-qtgui.sh /tmp/qt-source | tee /tmp/build.log
              library=$(sed -n "s/^QtGui: //p" /tmp/build.log)
              ./scripts/package-release.sh "$RELEASE_VERSION" "$library" "$archive"
            '
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_VERSION" \
            dist/*.tar.gz dist/SHA256SUMS --verify-tag \
            --title "Ozone for WSLg $RELEASE_VERSION" --notes-file release/README.md
